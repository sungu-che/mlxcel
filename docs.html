<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docs · mlxcel</title>
    <meta name="description" content="mlxcel documentation, synced from lablup/mlxcel docs/ on a schedule.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root{
            color-scheme: dark;
            --bg: #090c0f;
            --bg-raised: #0f1417;
            --bg-active: #171b1d;
            --text: #ffffff;
            --text-2: #ffffff;
            --muted: #c3c9cb;
            --faint: #9ca3a6;
            --line: rgba(255,255,255,0.09);
            --accent: #0ea5e9;
            --accent-soft: #38bdf8;
            --code-bg: #0c1013;
            --font: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }
        *{margin: 0; padding: 0; box-sizing: border-box;}
        html{overflow-x: hidden; scroll-behavior: smooth;}
        body{
            background: var(--bg); color: var(--text-2);
            font-family: var(--font); font-size: 15px; line-height: 1.65;
            -webkit-font-smoothing: antialiased;
        }
        ::selection{background: var(--accent); color: #ffffff;}
        .md, .md p, .md li, .md td, .md blockquote{color: var(--text-2);}
        a{color: var(--accent-soft); text-decoration: none;}
        a:hover{text-decoration: underline;}
        button{font: inherit; color: inherit; background: none; border: 0; cursor: pointer;}

        /* ---------- Top bar ---------- */
        #topbar{
            position: sticky; top: 0; z-index: 20; height: 56px;
            background: rgba(9,12,15,0.85);
            -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--line);
        }
        #topbar .inner{
            height: 100%; padding: 0 1.25rem;
            display: flex; align-items: center; gap: 1.5rem;
        }
        .brand{display: flex; align-items: center; gap: 0.55rem; color: var(--text); font-weight: 600; font-size: 0.95rem; white-space: nowrap;}
        .brand:hover{text-decoration: none;}
        .brand-mark{
            width: 22px; height: 22px; border-radius: 6px;
            background: linear-gradient(135deg, var(--accent-soft), var(--accent));
            display: inline-block;
        }
        .brand-sub{color: var(--faint); font-weight: 400;}
        #topnav{display: flex; gap: 1.25rem; margin-left: 0.5rem;}
        #topnav a{color: var(--muted); font-size: 0.9rem;}
        #topnav a:hover{color: var(--text); text-decoration: none;}
        #topnav a[aria-current="page"]{color: var(--text);}
        .spacer{flex: 1;}
        .search-btn{
            display: flex; align-items: center; gap: 0.5rem;
            width: 220px; height: 34px; padding: 0 0.6rem;
            border: 1px solid var(--line); border-radius: 8px; background: var(--bg-raised);
            color: var(--faint); font-size: 0.85rem;
        }
        .search-btn:hover{border-color: rgba(255,255,255,0.18);}
        .search-btn kbd{
            margin-left: auto; font-family: var(--mono); font-size: 0.72rem;
            border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; color: var(--faint);
        }
        #menu-btn{display: none; width: 34px; height: 34px; align-items: center; justify-content: center; color: var(--text);}

        /* ---------- Three-column layout ---------- */
        .layout{
            display: grid; grid-template-columns: 260px minmax(0, 1fr) 210px;
            max-width: 1360px; margin: 0 auto;
        }
        #sidebar{
            position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto;
            padding: 1.5rem 1rem 2rem 1.25rem; border-right: 1px solid var(--line);
        }
        #sidebar h2{
            font-size: 0.78rem; font-weight: 600; color: var(--text);
            margin: 0 0 0.6rem 0.5rem; letter-spacing: 0.01em;
        }
        #filter{
            width: 100%; height: 32px; margin-bottom: 0.9rem; padding: 0 0.6rem;
            background: var(--bg-raised); border: 1px solid var(--line); border-radius: 8px;
            color: var(--text); font: inherit; font-size: 0.85rem; outline: none;
        }
        #filter:focus{border-color: var(--accent);}
        #filter::placeholder{color: var(--faint);}
        #doc-list{list-style: none;}
        #doc-list a{
            display: block; padding: 0.4rem 0.65rem; border-radius: 6px;
            color: var(--muted); font-size: 0.88rem; line-height: 1.35;
        }
        #doc-list a:hover{color: var(--text); background: var(--bg-raised); text-decoration: none;}
        #doc-list a[aria-current="page"]{color: var(--accent-soft); background: var(--bg-active); font-weight: 500;}
        #doc-list li[hidden]{display: none;}

        #content{min-width: 0; padding: 2.5rem 2.75rem 5rem;}
        #crumb{font-size: 0.82rem; color: var(--faint); margin-bottom: 0.75rem;}
        #meta{font-size: 0.8rem; color: var(--faint); margin-bottom: 2rem;}
        #meta a{color: var(--faint); text-decoration: underline; text-decoration-color: var(--line);}
        #status{color: var(--muted); padding: 2rem 0;}
        #status.error{color: #f87171;}

        /* ---------- Rendered markdown ---------- */
        .md{max-width: 760px; overflow-wrap: anywhere;}
        .md h1, .md h2, .md h3, .md h4{color: var(--text); font-weight: 600; letter-spacing: -0.01em; scroll-margin-top: 80px;}
        .md h1{font-size: 2.2rem; line-height: 1.2; margin: 0 0 1rem; letter-spacing: -0.02em;}
        .md h2{font-size: 1.5rem; margin: 2.6rem 0 0.8rem; padding-bottom: 0.4rem; border-bottom: 1px solid var(--line);}
        .md h3{font-size: 1.15rem; margin: 2rem 0 0.6rem;}
        .md h4{font-size: 1rem; margin: 1.5rem 0 0.5rem;}
        .md p, .md ul, .md ol, .md blockquote, .md table, .md pre{margin: 0.95rem 0;}
        .md ul, .md ol{padding-left: 1.4rem;}
        .md li+li{margin-top: 0.3rem;}
        .md strong{color: var(--text); font-weight: 600;}
        .md code{font-family: var(--mono); font-size: 0.84em; background: var(--bg-active); color: var(--text-2); padding: 0.12em 0.4em; border-radius: 5px;}
        .md pre{background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.1rem; overflow-x: auto;}
        .md pre code{background: none; padding: 0; font-size: 0.84rem; color: var(--text-2); white-space: pre;}
        .md blockquote{border-left: 2px solid var(--accent); padding: 0.1rem 0 0.1rem 1rem; color: var(--muted);}
        .md table{border-collapse: collapse; display: block; overflow-x: auto; max-width: 100%;}
        .md th, .md td{border: 1px solid var(--line); padding: 0.45rem 0.75rem; text-align: left; vertical-align: top;}
        .md th{background: var(--bg-raised); color: var(--text); font-weight: 500;}
        .md img{max-width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--line);}
        .md hr{border: 0; border-top: 1px solid var(--line); margin: 2.2rem 0;}

        /* ---------- Right: on this page ---------- */
        #toc{
            position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto;
            padding: 2.5rem 1.25rem 2rem 0.5rem; font-size: 0.82rem;
        }
        #toc h2{font-size: 0.78rem; font-weight: 600; color: var(--text); margin-bottom: 0.7rem;}
        #toc ul{list-style: none; border-left: 1px solid var(--line);}
        #toc a{display: block; padding: 0.25rem 0 0.25rem 0.9rem; margin-left: -1px; border-left: 1px solid transparent; color: var(--faint); line-height: 1.4;}
        #toc a:hover{color: var(--text); text-decoration: none;}
        #toc a.active{color: var(--accent-soft); border-left-color: var(--accent-soft);}
        #toc a.lvl3{padding-left: 1.7rem;}

        /* ---------- Search dialog ---------- */
        #search-dialog{
            position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.6);
            display: none; align-items: flex-start; justify-content: center; padding-top: 12vh;
        }
        #search-dialog.open{display: flex;}
        #search-box{
            width: min(560px, calc(100vw - 2rem)); background: var(--bg-raised);
            border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
            box-shadow: 0 24px 60px rgba(0,0,0,0.5);
        }
        #search-input{
            width: 100%; height: 48px; padding: 0 1rem; background: transparent; border: 0;
            border-bottom: 1px solid var(--line); color: var(--text); font: inherit; font-size: 0.95rem; outline: none;
        }
        #search-results{list-style: none; max-height: 360px; overflow-y: auto; padding: 0.4rem;}
        #search-results a{display: block; padding: 0.55rem 0.7rem; border-radius: 8px; color: var(--text-2);}
        #search-results a:hover, #search-results a.sel{background: var(--bg-active); text-decoration: none; color: var(--text);}
        #search-results .none{padding: 0.7rem; color: var(--faint);}

        /* ---------- Responsive ---------- */
        @media (max-width: 1180px){
            .layout{grid-template-columns: 240px minmax(0, 1fr);}
            #toc{display: none;}
        }
        @media (max-width: 860px){
            .layout{grid-template-columns: minmax(0, 1fr);}
            #sidebar{
                position: fixed; top: 56px; left: 0; bottom: 0; width: 280px; height: auto; z-index: 15;
                background: var(--bg); transform: translateX(-100%); transition: transform 0.2s ease;
            }
            #sidebar.open{transform: translateX(0);}
            #menu-btn{display: inline-flex;}
            #topnav{display: none;}
            #content{padding: 1.75rem 1.25rem 4rem;}
            .md h1{font-size: 1.8rem;}
            .search-btn{width: 34px; padding: 0; justify-content: center;}
            .search-btn span, .search-btn kbd{display: none;}
            .brand-sub{display: none;}
        }
    </style>
</head>
<body>
    <header id="topbar">
        <div class="inner">
            <button id="menu-btn" aria-label="Open navigation">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <a class="brand" href="index.html">
                <span class="brand-mark"></span>
                <span>mlxcel</span>
                <span class="brand-sub">/ Docs</span>
            </a>
            <nav id="topnav" aria-label="Main">
                <a href="index.html#get-started">Get Started</a>
                <a href="index.html#performance">Performance</a>
                <a href="https://github.com/lablup/mlxcel" target="_blank" rel="noopener">GitHub</a>
                <a href="docs.html" aria-current="page">Docs</a>
            </nav>
            <span class="spacer"></span>
            <button class="search-btn" id="search-open" aria-label="Search docs">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
                <span>Search docs</span>
                <kbd>Ctrl K</kbd>
            </button>
        </div>
    </header>

    <div class="layout">
        <aside id="sidebar">
            <h2>Documentation</h2>
            <input id="filter" type="search" placeholder="Filter pages…" aria-label="Filter pages">
            <ul id="doc-list"></ul>
        </aside>

        <main id="content">
            <div id="crumb"></div>
            <div id="meta"></div>
            <div id="status">Loading…</div>
            <article id="doc" class="md" hidden></article>
        </main>

        <aside id="toc" aria-label="On this page">
            <h2>On this page</h2>
            <ul id="toc-list"></ul>
        </aside>
    </div>

    <div id="search-dialog" role="dialog" aria-modal="true" aria-label="Search docs">
        <div id="search-box">
            <input id="search-input" type="search" placeholder="Search documentation…" aria-label="Search documentation">
            <ul id="search-results"></ul>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/13.0.3/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
    <script>
    (function () {
        var SOURCE_BLOB = 'https://github.com/lablup/mlxcel/blob/main/docs/';
        var SOURCE_RAW = 'https://raw.githubusercontent.com/lablup/mlxcel/main/docs/';
        var CONTENT_DIR = 'docs-content/';

        var $ = function (id) { return document.getElementById(id); };
        var sidebar = $('sidebar');
        var menuBtn = $('menu-btn');
        var list = $('doc-list');
        var filter = $('filter');
        var meta = $('meta');
        var crumb = $('crumb');
        var status = $('status');
        var article = $('doc');
        var tocList = $('toc-list');
        var dialog = $('search-dialog');
        var searchInput = $('search-input');
        var searchResults = $('search-results');

        menuBtn.addEventListener('click', function () { sidebar.classList.toggle('open'); });

        var files = [];
        var bySlug = {};
        var byName = {};
        var loadedSlug = null;
        var tocObserver = null;

        function setStatus(msg, isError) {
            status.textContent = msg;
            status.className = isError ? 'error' : '';
            status.hidden = !msg;
        }

        // GitHub-style heading anchor.
        function slugify(text) {
            return text.trim().toLowerCase()
                .replace(/<[^>]+>/g, '')
                .replace(/[^\p{L}\p{N}\s-]/gu, '')
                .replace(/\s+/g, '-');
        }

        // Keep links inside the docs page when they point at a synced doc,
        // send other repo links to GitHub, and load images from the raw repo.
        function fixLinks(root, currentSlug) {
            root.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(function (h) {
                if (!h.id) h.id = slugify(h.textContent);
            });

            root.querySelectorAll('img[src]').forEach(function (img) {
                var src = img.getAttribute('src');
                if (!/^(https?:|data:|\/)/.test(src)) {
                    img.setAttribute('src', new URL(src, SOURCE_RAW).href);
                }
            });

            root.querySelectorAll('a[href]').forEach(function (a) {
                var href = a.getAttribute('href');
                if (href.charAt(0) === '#') {
                    a.setAttribute('href', '#' + currentSlug + '/' + href.slice(1));
                    return;
                }
                if (/^(https?:|mailto:)/.test(href)) {
                    a.setAttribute('target', '_blank');
                    a.setAttribute('rel', 'noopener');
                    return;
                }
                var resolved = new URL(href, SOURCE_BLOB).href;
                if (resolved.indexOf(SOURCE_BLOB) === 0) {
                    var path = resolved.slice(SOURCE_BLOB.length);
                    var hashPart = '';
                    var hashAt = path.indexOf('#');
                    if (hashAt !== -1) { hashPart = path.slice(hashAt + 1); path = path.slice(0, hashAt); }
                    var target = byName[path];
                    if (target) {
                        a.setAttribute('href', '#' + target.slug + (hashPart ? '/' + hashPart : ''));
                        return;
                    }
                }
                a.setAttribute('href', resolved);
                a.setAttribute('target', '_blank');
                a.setAttribute('rel', 'noopener');
            });
        }

        // Right-hand "On this page" outline built from h2/h3 headings.
        function buildToc() {
            tocList.innerHTML = '';
            if (tocObserver) { tocObserver.disconnect(); tocObserver = null; }
            var heads = article.querySelectorAll('h2, h3');
            heads.forEach(function (h) {
                var li = document.createElement('li');
                var a = document.createElement('a');
                a.href = '#' + loadedSlug + '/' + h.id;
                a.textContent = h.textContent;
                if (h.tagName === 'H3') a.className = 'lvl3';
                a.dataset.id = h.id;
                li.appendChild(a);
                tocList.appendChild(li);
            });
            document.querySelector('#toc').style.display = heads.length ? '' : 'none';
            if ('IntersectionObserver' in window && heads.length) {
                tocObserver = new IntersectionObserver(function (entries) {
                    entries.forEach(function (e) {
                        if (!e.isIntersecting) return;
                        tocList.querySelectorAll('a').forEach(function (a) {
                            a.classList.toggle('active', a.dataset.id === e.target.id);
                        });
                    });
                }, { rootMargin: '0px 0px -70% 0px' });
                heads.forEach(function (h) { tocObserver.observe(h); });
            }
        }

        function renderSidebar(currentSlug) {
            list.innerHTML = '';
            files.forEach(function (f) {
                var li = document.createElement('li');
                var a = document.createElement('a');
                a.href = '#' + f.slug;
                a.textContent = f.title;
                a.dataset.title = f.title.toLowerCase();
                if (f.slug === currentSlug) a.setAttribute('aria-current', 'page');
                li.appendChild(a);
                list.appendChild(li);
            });
            applyFilter();
        }

        function applyFilter() {
            var q = filter.value.trim().toLowerCase();
            list.querySelectorAll('li').forEach(function (li) {
                var a = li.firstChild;
                li.hidden = !!q && a.dataset.title.indexOf(q) === -1;
            });
        }
        filter.addEventListener('input', applyFilter);

        function scrollToAnchor(anchor) {
            if (!anchor) { window.scrollTo(0, 0); return; }
            var el = document.getElementById(anchor);
            if (el) el.scrollIntoView();
        }

        function loadDoc(slug) {
            var f = bySlug[slug];
            return fetch(CONTENT_DIR + f.name, { cache: 'no-cache' })
                .then(function (res) {
                    if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
                    return res.text();
                })
                .then(function (md) {
                    article.innerHTML = DOMPurify.sanitize(marked.parse(md));
                    fixLinks(article, slug);
                    article.hidden = false;
                    setStatus('');
                    loadedSlug = slug;
                    crumb.textContent = 'Docs / ' + f.title;
                    document.title = f.title + ' · mlxcel docs';
                    renderSidebar(slug);
                    buildToc();
                });
        }

        function route() {
            var raw = decodeURIComponent(location.hash.slice(1));
            var parts = raw.split('/');
            var slug = parts[0] || (bySlug.README ? 'README' : (files[0] && files[0].slug));
            var anchor = parts.slice(1).join('/');

            if (!slug || !bySlug[slug]) {
                setStatus('Document not found: ' + slug, true);
                article.hidden = true;
                return;
            }
            sidebar.classList.remove('open');
            if (slug === loadedSlug) {
                renderSidebar(slug);
                scrollToAnchor(anchor);
                return;
            }
            setStatus('Loading…');
            article.hidden = true;
            loadDoc(slug).then(function () {
                scrollToAnchor(anchor);
            }).catch(function (err) {
                setStatus('Failed to load document: ' + err.message, true);
            });
        }

        function renderMeta(index) {
            var src = index.source || {};
            var parts = [];
            var dir = src.dir || 'docs';
            if (src.repo) parts.push('Synced from <a href="https://github.com/' + src.repo + '/tree/' + (src.ref || 'main') + '/' + dir + '" target="_blank" rel="noopener">' + src.repo + '/' + dir + '</a>');
            if (src.commit) parts.push('commit ' + src.commit.slice(0, 7));
            if (src.commitDate) parts.push('updated ' + new Date(src.commitDate).toISOString().slice(0, 10));
            meta.innerHTML = parts.join(' · ');
        }

        // ---------- Search dialog (Ctrl/Cmd+K) ----------
        var selIndex = 0;
        function openSearch() {
            dialog.classList.add('open');
            searchInput.value = '';
            renderSearch();
            searchInput.focus();
        }
        function closeSearch() { dialog.classList.remove('open'); }

        function renderSearch() {
            var q = searchInput.value.trim().toLowerCase();
            var hits = files.filter(function (f) {
                return !q || f.title.toLowerCase().indexOf(q) !== -1 || f.slug.toLowerCase().indexOf(q) !== -1;
            });
            selIndex = 0;
            searchResults.innerHTML = '';
            if (!hits.length) {
                var none = document.createElement('li');
                none.className = 'none';
                none.textContent = 'No matching pages';
                searchResults.appendChild(none);
                return;
            }
            hits.slice(0, 30).forEach(function (f, i) {
                var li = document.createElement('li');
                var a = document.createElement('a');
                a.href = '#' + f.slug;
                a.textContent = f.title;
                if (i === 0) a.className = 'sel';
                a.addEventListener('click', closeSearch);
                li.appendChild(a);
                searchResults.appendChild(li);
            });
        }

        function moveSel(delta) {
            var links = searchResults.querySelectorAll('a');
            if (!links.length) return;
            selIndex = (selIndex + delta + links.length) % links.length;
            links.forEach(function (a, i) { a.classList.toggle('sel', i === selIndex); });
            links[selIndex].scrollIntoView({ block: 'nearest' });
        }

        $('search-open').addEventListener('click', openSearch);
        searchInput.addEventListener('input', renderSearch);
        dialog.addEventListener('click', function (e) { if (e.target === dialog) closeSearch(); });
        document.addEventListener('keydown', function (e) {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                dialog.classList.contains('open') ? closeSearch() : openSearch();
            } else if (dialog.classList.contains('open')) {
                if (e.key === 'Escape') closeSearch();
                else if (e.key === 'ArrowDown') { e.preventDefault(); moveSel(1); }
                else if (e.key === 'ArrowUp') { e.preventDefault(); moveSel(-1); }
                else if (e.key === 'Enter') {
                    var sel = searchResults.querySelector('a.sel');
                    if (sel) { location.hash = sel.getAttribute('href'); closeSearch(); }
                }
            }
        });

        fetch(CONTENT_DIR + 'index.json', { cache: 'no-cache' })
            .then(function (res) {
                if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
                return res.json();
            })
            .then(function (index) {
                files = index.files || [];
                files.forEach(function (f) {
                    bySlug[f.slug] = f;
                    byName[f.name] = f;
                });
                renderMeta(index);
                if (!files.length) {
                    setStatus('No documents have been synced yet.');
                    return;
                }
                renderSidebar(null);
                window.addEventListener('hashchange', route);
                route();
            })
            .catch(function (err) {
                setStatus('Could not load the docs index: ' + err.message, true);
            });
    })();
    </script>
</body>
</html>
